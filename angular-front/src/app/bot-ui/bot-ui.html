<div class="p-3">
  <div class="input-group mb-3">
    <input
      [(ngModel)]="query"
      (keyup.enter)="askAgent()"
      type="text"
      class="form-control"
      placeholder="Posez votre question..."
    />
    <button class="btn btn-primary" (click)="askAgent()" title="Réponse complète">
      <i class="bi bi-send"></i>
    </button>
    <button class="btn btn-outline-primary" (click)="askAgentStream()" title="Streaming">
      <i class="bi bi-lightning"></i>
    </button>
  </div>

  @if (loadingService.isLoading()) {
    <div class="spinner-border text-success" role="status">
      <span class="visually-hidden">Chargement...</span>
    </div>
  }

  @if (response$ | async; as botResponse) {
    <markdown [data]="botResponse"></markdown>
  }
</div>
